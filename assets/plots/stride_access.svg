<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Stride access locality</title>
  <desc id="desc">Accessing every Nth item converts a streaming pattern into a sparse one with worse spatial locality.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="430"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">Stride access locality</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">Accessing every Nth item converts a streaming pattern into a sparse one with worse spatial locality.</text>
  <rect x="30" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="52" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">Sequential stream</text>
  <text x="52" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">best locality</text>
  <rect x="620" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="642" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">Sparse stream</text>
  <text x="642" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">more wasted fetches</text>
  <rect x="108" y="172" width="72" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="144.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">0</text>
  <rect x="194" y="172" width="72" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="230.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">1</text>
  <rect x="280" y="172" width="72" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="316.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">2</text>
  <rect x="366" y="172" width="72" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="402.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">3</text>
  <line x1="144" y1="188" x2="194" y2="188" stroke="#2a9d8f" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="230" y1="188" x2="280" y2="188" stroke="#2a9d8f" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="316" y1="188" x2="366" y2="188" stroke="#2a9d8f" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="72" y="226" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">stride 1</text>
  <text x="72" y="246" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">touch every cache line in order</text>
  <rect x="698" y="172" width="72" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="734.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">0</text>
  <rect x="784" y="172" width="72" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="820.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">4</text>
  <rect x="870" y="172" width="72" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="906.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">16</text>
  <rect x="956" y="172" width="72" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="992.0" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">64</text>
  <line x1="734" y1="188" x2="784" y2="188" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="820" y1="188" x2="870" y2="188" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="906" y1="188" x2="956" y2="188" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="662" y="226" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">large stride</text>
  <text x="662" y="246" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">skip most cache lines, so useful work per fetch drops</text>
  <text x="50" y="386" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">The key variable is how much useful data each fetched cache line contributes.</text>
</svg>
