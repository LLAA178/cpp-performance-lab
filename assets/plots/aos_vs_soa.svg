<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AoS vs SoA access pattern</title>
  <desc id="desc">Array-of-Structs keeps fields together, while Structure-of-Arrays lets the benchmark skip unused fields.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="420"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">AoS vs SoA</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">Use only the fields the loop actually touches.</text>
  <rect x="30" y="78" width="550" height="270" rx="16" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <rect x="620" y="78" width="550" height="270" rx="16" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="58" y="114" text-anchor="start" font-family="Georgia, serif" font-size="18" font-weight="700" font-style="normal" fill="#26323a">Array of Structs</text>
  <text x="648" y="114" text-anchor="start" font-family="Georgia, serif" font-size="18" font-weight="700" font-style="normal" fill="#26323a">Structure of Arrays</text>
  <text x="58" y="138" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">every element carries all fields</text>
  <text x="648" y="138" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">each field can be streamed independently</text>
  <rect x="78" y="170" width="420" height="40" rx="10" fill="#fdf4e8" stroke="#c08a28" stroke-width="2"/>
  <text x="96" y="195" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">item 0</text>
  <rect x="170" y="176" width="84" height="28" rx="8" fill="#d8ebff" stroke="#4c87c6" stroke-width="2"/>
  <rect x="262" y="176" width="84" height="28" rx="8" fill="#e6f4d8" stroke="#4f9b5d" stroke-width="2"/>
  <rect x="354" y="176" width="84" height="28" rx="8" fill="#efe1fb" stroke="#7a5c9e" stroke-width="2"/>
  <text x="212" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">A</text>
  <text x="304" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">B</text>
  <text x="396" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">C</text>
  <line x1="180" y1="216" x2="180" y2="234" stroke="#2a9d8f" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <line x1="364" y1="216" x2="364" y2="234" stroke="#2a9d8f" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="78" y="214" width="420" height="40" rx="10" fill="#fdf4e8" stroke="#c08a28" stroke-width="2"/>
  <text x="96" y="239" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">item 1</text>
  <rect x="170" y="220" width="84" height="28" rx="8" fill="#d8ebff" stroke="#4c87c6" stroke-width="2"/>
  <rect x="262" y="220" width="84" height="28" rx="8" fill="#e6f4d8" stroke="#4f9b5d" stroke-width="2"/>
  <rect x="354" y="220" width="84" height="28" rx="8" fill="#efe1fb" stroke="#7a5c9e" stroke-width="2"/>
  <text x="212" y="239" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">A</text>
  <text x="304" y="239" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">B</text>
  <text x="396" y="239" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">C</text>
  <line x1="180" y1="260" x2="180" y2="278" stroke="#2a9d8f" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <line x1="364" y1="260" x2="364" y2="278" stroke="#2a9d8f" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="78" y="258" width="420" height="40" rx="10" fill="#fdf4e8" stroke="#c08a28" stroke-width="2"/>
  <text x="96" y="283" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">item 2</text>
  <rect x="170" y="264" width="84" height="28" rx="8" fill="#d8ebff" stroke="#4c87c6" stroke-width="2"/>
  <rect x="262" y="264" width="84" height="28" rx="8" fill="#e6f4d8" stroke="#4f9b5d" stroke-width="2"/>
  <rect x="354" y="264" width="84" height="28" rx="8" fill="#efe1fb" stroke="#7a5c9e" stroke-width="2"/>
  <text x="212" y="283" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">A</text>
  <text x="304" y="283" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">B</text>
  <text x="396" y="283" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">C</text>
  <line x1="180" y1="304" x2="180" y2="322" stroke="#2a9d8f" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <line x1="364" y1="304" x2="364" y2="322" stroke="#2a9d8f" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="100" y="338" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">The loop still pulls B into cache even when it is unused.</text>
  <rect x="678" y="176" width="92" height="110" rx="12" fill="#fff" stroke="#4c87c6" stroke-width="2"/>
  <text x="724" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">A[]</text>
  <rect x="696" y="222" width="56" height="18" rx="6" fill="#f6fbff" stroke="#4c87c6" stroke-width="2"/>
  <rect x="696" y="246" width="56" height="18" rx="6" fill="#f6fbff" stroke="#4c87c6" stroke-width="2"/>
  <rect x="696" y="270" width="56" height="18" rx="6" fill="#f6fbff" stroke="#4c87c6" stroke-width="2"/>
  <rect x="800" y="176" width="92" height="110" rx="12" fill="#fff" stroke="#7d8790" stroke-width="2"/>
  <text x="846" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">B[]</text>
  <rect x="818" y="222" width="56" height="18" rx="6" fill="#f3f4f6" stroke="#7d8790" stroke-width="2"/>
  <rect x="818" y="246" width="56" height="18" rx="6" fill="#f3f4f6" stroke="#7d8790" stroke-width="2"/>
  <rect x="818" y="270" width="56" height="18" rx="6" fill="#f3f4f6" stroke="#7d8790" stroke-width="2"/>
  <rect x="922" y="176" width="92" height="110" rx="12" fill="#fff" stroke="#4f9b5d" stroke-width="2"/>
  <text x="968" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">C[]</text>
  <rect x="940" y="222" width="56" height="18" rx="6" fill="#f6fbff" stroke="#4f9b5d" stroke-width="2"/>
  <rect x="940" y="246" width="56" height="18" rx="6" fill="#f6fbff" stroke="#4f9b5d" stroke-width="2"/>
  <rect x="940" y="270" width="56" height="18" rx="6" fill="#f6fbff" stroke="#4f9b5d" stroke-width="2"/>
  <text x="660" y="338" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">A and C can be streamed without dragging B through the cache.</text>
</svg>
