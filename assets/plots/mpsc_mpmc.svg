<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Queue scaling topology</title>
  <desc id="desc">Changing from MPSC to MPMC changes how many threads contend for enqueue and dequeue metadata.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="430"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">Queue scaling topology</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">Changing from MPSC to MPMC changes how many threads contend for enqueue and dequeue metadata.</text>
  <rect x="30" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="52" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">4P1C</text>
  <text x="52" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">single dequeue side</text>
  <rect x="620" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="642" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">4P4C</text>
  <text x="642" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">metadata hot on both ends</text>
  <rect x="86" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="112.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P0</text>
  <line x1="112" y1="184" x2="210" y2="230" stroke="#7d8790" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <rect x="156" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="182.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P1</text>
  <line x1="182" y1="184" x2="210" y2="230" stroke="#7d8790" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <rect x="226" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="252.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P2</text>
  <line x1="252" y1="184" x2="210" y2="230" stroke="#7d8790" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <rect x="296" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="322.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P3</text>
  <line x1="322" y1="184" x2="210" y2="230" stroke="#7d8790" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <rect x="174" y="230" width="120" height="27" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="234.0" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">1 consumer</text>
  <text x="72" y="296" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">4 producers funnel into one dequeue point</text>
  <rect x="676" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="702.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P0</text>
  <rect x="746" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="772.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P1</text>
  <rect x="816" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="842.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P2</text>
  <rect x="886" y="154" width="52" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="912.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">P3</text>
  <rect x="676" y="256" width="52" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="702.0" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">C0</text>
  <rect x="746" y="256" width="52" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="772.0" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">C1</text>
  <rect x="816" y="256" width="52" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="842.0" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">C2</text>
  <rect x="886" y="256" width="52" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="912.0" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">C3</text>
  <rect x="744" y="206" width="156" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="822.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">shared queue metadata</text>
  <text x="658" y="314" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">multiple producers and consumers fight over the same indices</text>
  <text x="50" y="386" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">Topology matters enough that the same algorithm can win in one shape and lose badly in another.</text>
</svg>
