<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Queue message size and batching</title>
  <desc id="desc">Larger payloads make data movement matter more, while batching changes how often the queue pays its coordination overhead.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="430"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">Queue message size and batching</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">Larger payloads make data movement matter more, while batching changes how often the queue pays its coordination overhead.</text>
  <rect x="30" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="52" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">Unbatched transfer</text>
  <text x="52" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">coordination per message</text>
  <rect x="620" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="642" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">Batched transfer</text>
  <text x="642" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">amortized coordination</text>
  <rect x="118" y="174" width="116" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="176.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">256B msg</text>
  <rect x="266" y="174" width="116" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="324.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">lock/unlock</text>
  <rect x="414" y="174" width="116" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="472.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">256B msg</text>
  <text x="86" y="258" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">unbatched mutex queue pays the lock for each payload</text>
  <rect x="708" y="152" width="100" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="758.0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">msg x8</text>
  <rect x="836" y="152" width="92" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="882.0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">one lock</text>
  <rect x="954" y="152" width="100" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="1004.0" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">msg x8</text>
  <rect x="774" y="246" width="250" height="27" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="899.0" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">SPSC already has a light control path</text>
  <text x="676" y="314" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">batching helps most when coordination cost dominates payload movement</text>
  <text x="50" y="386" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">Batch size is an algorithmic parameter, not just a tuning footnote.</text>
</svg>
