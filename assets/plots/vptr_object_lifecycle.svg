<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">vptr object layout and lifetime</title>
  <desc id="desc">These experiments stay on the object side: how a polymorphic object grows, when its active vptr changes, and how those choices show up in hot-loop throughput.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="560"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">vptr object layout and lifetime</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">These experiments stay on the object side: how a polymorphic object grows, when its active vptr changes, and how those choices show up in hot-loop throughput.</text>
  <rect x="30" y="78" width="356" height="390" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="52" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">1. Layout tax</text>
  <text x="52" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">one object in memory</text>
  <text x="72" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Plain object</text>
  <rect x="76" y="170" width="120" height="42" rx="10" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="136" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">PlainLeaf</text>
  <rect x="76" y="212" width="120" height="34" rx="10" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="136" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">payload @ +0</text>
  <rect x="76" y="246" width="120" height="34" rx="10" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="136" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">bias @ +8</text>
  <text x="136" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">16 B total</text>
  <text x="234" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Polymorphic object</text>
  <rect x="238" y="170" width="126" height="42" rx="10" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="301" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">PolyLeafA</text>
  <rect x="238" y="212" width="126" height="32" rx="10" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="301" y="233" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">vptr @ +0</text>
  <rect x="238" y="244" width="126" height="32" rx="10" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="301" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">payload @ +8</text>
  <rect x="238" y="276" width="126" height="32" rx="10" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="301" y="297" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">bias @ +16</text>
  <text x="301" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">24 B total</text>
  <text x="72" y="366" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="700" font-style="normal" fill="#5b6770">Measured counters:</text>
  <text x="72" y="386" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">plain_bytes=16, poly_bytes=24, extra_bytes=8</text>
  <text x="72" y="406" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">plain_payload_off=0, poly_payload_off=8</text>
  <text x="72" y="426" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">Dense scan: plain 5.34G vs polymorphic 3.04G items/s</text>
  <rect x="416" y="78" width="356" height="390" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="438" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">2. Lifetime rewrites</text>
  <text x="438" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">active vptr changes over time</text>
  <text x="458" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Lifecycle probe</text>
  <line x1="470" y1="236" x2="730" y2="236" stroke="#7d8790" stroke-width="3" fill="none"/>
  <circle cx="78" cy="236" r="8" fill="#4c87c6" stroke="#4c87c6" stroke-width="1"/>
  <circle cx="154" cy="236" r="8" fill="#4f9b5d" stroke="#4f9b5d" stroke-width="1"/>
  <circle cx="230" cy="236" r="8" fill="#4f9b5d" stroke="#4f9b5d" stroke-width="1"/>
  <circle cx="306" cy="236" r="8" fill="#4c87c6" stroke="#4c87c6" stroke-width="1"/>
  <rect x="452.0" y="286" width="84" height="54" rx="12" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="494" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">base ctor</text>
  <text x="494" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" font-style="normal" fill="#5b6770">0xBACE</text>
  <rect x="528.0" y="194" width="84" height="54" rx="12" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="570" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">derived ctor</text>
  <text x="570" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" font-style="normal" fill="#5b6770">0xD00D</text>
  <rect x="604.0" y="194" width="84" height="54" rx="12" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="646" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">derived dtor</text>
  <text x="646" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" font-style="normal" fill="#5b6770">0xD00D</text>
  <rect x="680.0" y="286" width="84" height="54" rx="12" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="722" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">base dtor</text>
  <text x="722" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" font-style="normal" fill="#5b6770">0xBACE</text>
  <line x1="494" y1="258" x2="494" y2="245" stroke="#4c87c6" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="570" y1="194" x2="570" y2="160" stroke="#4f9b5d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="646" y1="194" x2="646" y2="160" stroke="#4f9b5d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="722" y1="258" x2="722" y2="245" stroke="#4c87c6" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="368" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="700" font-style="normal" fill="#5b6770">Measured counters:</text>
  <text x="458" y="388" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">samples=4, unique_vptrs=2, vptr_switches=2</text>
  <text x="458" y="408" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">order: base ctor -&gt; derived ctor -&gt; derived dtor -&gt; base dtor</text>
  <text x="458" y="428" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">Construct/destroy throughput: plain 1.216G vs virtual 1.208G items/s</text>
  <rect x="802" y="78" width="356" height="390" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="824" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">3. Dispatch cost</text>
  <text x="824" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">call throughput on hot paths</text>
  <text x="844" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Hot-path dispatch</text>
  <rect x="846" y="174" width="96" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="894.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">direct call</text>
  <rect x="960" y="174" width="108" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="1014.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">mono virtual</text>
  <rect x="1086" y="174" width="112" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="1142.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">mixed virtual</text>
  <text x="894" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#26323a">3.13G items/s</text>
  <text x="1014" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#26323a">1.22G items/s</text>
  <text x="1142" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#26323a">670M items/s</text>
  <line x1="894" y1="188" x2="960" y2="188" stroke="#7d8790" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="1068" y1="188" x2="1086" y2="188" stroke="#7d8790" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="844" y="288" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Call-path shape</text>
  <rect x="846" y="310" width="56" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="874.0" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">obj</text>
  <rect x="918" y="310" width="60" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="948.0" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">vptr</text>
  <rect x="994" y="310" width="70" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="1029.0" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">vtable</text>
  <rect x="1080" y="310" width="86" height="27" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="1123.0" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">target fn</text>
  <line x1="902" y1="324" x2="918" y2="324" stroke="#c08a28" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="978" y1="324" x2="994" y2="324" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="1064" y1="324" x2="1080" y2="324" stroke="#4c87c6" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="844" y="368" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">The object-side experiments are one group: footprint, lifetime rewrites, and call throughput.</text>
  <text x="844" y="388" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">They answer how polymorphism changes one object and one hot loop.</text>
  <text x="50" y="508" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">This figure is only about layout, lifetime, and dispatch. It does not try to show the detailed vtable ABI view.</text>
</svg>
