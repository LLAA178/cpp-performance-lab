<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mutex vs Atomic contention path</title>
  <desc id="desc">Atomic fetch_add and mutex-protected increments both bounce cache-line ownership; mutex adds lock management on top.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="430"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">Mutex vs Atomic</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">Shared-write contention dominates both paths.</text>
  <rect x="30" y="78" width="550" height="290" rx="16" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <rect x="620" y="78" width="550" height="290" rx="16" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="60" y="114" text-anchor="start" font-family="Georgia, serif" font-size="18" font-weight="700" font-style="normal" fill="#26323a">Atomic fetch_add</text>
  <text x="650" y="114" text-anchor="start" font-family="Georgia, serif" font-size="18" font-weight="700" font-style="normal" fill="#26323a">Mutex lock + critical section</text>
  <rect x="74" y="166" width="132" height="72" rx="14" fill="#eaf5ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="140" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">core 0</text>
  <text x="140" y="217" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">atomic RMW</text>
  <rect x="324" y="166" width="132" height="72" rx="14" fill="#eaf5ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="390" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">core 1</text>
  <text x="390" y="217" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">atomic RMW</text>
  <rect x="192" y="266" width="168" height="44" rx="10" fill="#fff3df" stroke="#c08a28" stroke-width="2"/>
  <text x="276" y="293" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">shared counter cache line</text>
  <line x1="140" y1="238" x2="246" y2="266" stroke="#c14d4d" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <line x1="390" y1="238" x2="306" y2="266" stroke="#c14d4d" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="332" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">cache line ownership bounces between cores</text>
  <rect x="660" y="166" width="128" height="56" rx="12" fill="#f3eefb" stroke="#7a5c9e" stroke-width="2"/>
  <text x="724" y="199" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">lock()</text>
  <rect x="826" y="166" width="128" height="56" rx="12" fill="#f3eefb" stroke="#7a5c9e" stroke-width="2"/>
  <text x="890" y="199" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">critical</text>
  <text x="890" y="219" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">section</text>
  <rect x="992" y="166" width="128" height="56" rx="12" fill="#f3eefb" stroke="#7a5c9e" stroke-width="2"/>
  <text x="1056" y="199" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" font-style="normal" fill="#26323a">unlock()</text>
  <line x1="788" y1="194" x2="826" y2="194" stroke="#7a5c9e" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <line x1="954" y1="194" x2="992" y2="194" stroke="#7a5c9e" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="694" y="262" width="408" height="48" rx="12" fill="#fff3df" stroke="#c08a28" stroke-width="2"/>
  <text x="898" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#26323a">lock word and counter still contend on the same cache line</text>
  <text x="664" y="336" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">The mutex path pays the same coherence cost plus lock bookkeeping.</text>
</svg>
