<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Exception vs error code</title>
  <desc id="desc">Cold-path signaling is cheap when nothing fails, but actual exception throws trigger a much heavier control-flow path.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="430"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">Exception vs error code</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">Cold-path signaling is cheap when nothing fails, but actual exception throws trigger a much heavier control-flow path.</text>
  <rect x="30" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="52" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">Error code</text>
  <text x="52" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">branch on return</text>
  <rect x="620" y="78" width="550" height="280" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="642" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">Exception</text>
  <text x="642" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">stack unwind on failure</text>
  <rect x="116" y="174" width="120" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="176.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">return code</text>
  <rect x="266" y="174" width="108" height="27" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="320.0" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">check path</text>
  <text x="88" y="252" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">no-fail path stays in-band</text>
  <rect x="706" y="154" width="92" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="752.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">throw</text>
  <rect x="828" y="154" width="124" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="890.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">stack unwind</text>
  <rect x="984" y="154" width="72" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="1020.0" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">catch</text>
  <line x1="798" y1="169" x2="828" y2="169" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="952" y1="169" x2="984" y2="169" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="666" y="264" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">actual throws are expensive because control flow and unwinding become the work</text>
  <text x="50" y="386" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">The cost jump is mostly about what happens on failure, not the nominal syntax of the API.</text>
</svg>
