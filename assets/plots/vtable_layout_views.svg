<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">vtable layout views</title>
  <desc id="desc">These experiments stay on the metadata side: what the vtable address point exposes under single inheritance, and how multiple inheritance creates more than one base-subobject view.</desc>
  <style>
  .bg { fill: #f7f4ec; }
  .title { font: 700 23px Georgia, serif; fill: #26323a; }
  .subtitle { font: 500 14px Georgia, serif; fill: #5b6770; }
  .label { font: 700 16px Georgia, serif; fill: #26323a; }
  .text { font: 13px Georgia, serif; fill: #26323a; }
  .small { font: 12px Georgia, serif; fill: #5b6770; }
</style>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323a"/>
  </marker>
</defs>
  <rect class="bg" x="0" y="0" width="1200" height="540"/>
  <text x="40" y="42" text-anchor="start" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="normal" fill="#26323a">vtable layout views</text>
  <text x="40" y="65" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="400" font-style="normal" fill="#5b6770">These experiments stay on the metadata side: what the vtable address point exposes under single inheritance, and how multiple inheritance creates more than one base-subobject view.</text>
  <rect x="30" y="78" width="356" height="380" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="52" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">1. Single inheritance</text>
  <text x="52" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">one vptr, one address point</text>
  <text x="72" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Single inheritance probe</text>
  <rect x="72" y="170" width="96" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="120.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">SingleBase*</text>
  <rect x="186" y="170" width="58" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="215.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">vptr</text>
  <rect x="262" y="170" width="104" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="314.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">address point</text>
  <line x1="168" y1="184" x2="186" y2="184" stroke="#4c87c6" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="244" y1="184" x2="262" y2="184" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <rect x="262" y="212" width="104" height="30" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="314" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" font-style="normal" fill="#26323a">offset_to_top=0</text>
  <rect x="262" y="242" width="104" height="30" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="314" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" font-style="normal" fill="#26323a">typeinfo*</text>
  <rect x="262" y="272" width="104" height="30" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="314" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" font-style="normal" fill="#26323a">slot0 = 11</text>
  <rect x="262" y="302" width="104" height="30" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="314" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" font-style="normal" fill="#26323a">slot1 = 22</text>
  <text x="72" y="364" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="700" font-style="normal" fill="#5b6770">Measured counters:</text>
  <text x="72" y="384" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">offset_to_top=0, typeinfo_match=1, slot results 11 / 22</text>
  <rect x="416" y="78" width="356" height="380" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="438" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">2. Multiple inheritance views</text>
  <text x="438" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">two base-subobject pointers</text>
  <text x="458" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Multiple inheritance object views</text>
  <rect x="470" y="176" width="132" height="42" rx="10" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="536" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">LeftBase view</text>
  <text x="536" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" font-style="normal" fill="#5b6770">offset 0</text>
  <rect x="622" y="176" width="132" height="42" rx="10" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="688" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">RightBase view</text>
  <text x="688" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" font-style="normal" fill="#5b6770">offset +8</text>
  <rect x="528" y="274" width="168" height="42" rx="10" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="612" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">MultiVtableDerived</text>
  <line x1="536" y1="218" x2="586" y2="262" stroke="#c08a28" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="688" y1="218" x2="638" y2="262" stroke="#4c87c6" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="364" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="700" font-style="normal" fill="#5b6770">Measured counters:</text>
  <text x="458" y="384" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">left_offset=0, right_offset=-8, shared_typeinfo=1</text>
  <text x="458" y="404" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">The two base views share RTTI but do not share the same address point.</text>
  <rect x="802" y="78" width="356" height="380" rx="18" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="824" y="110" text-anchor="start" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="normal" fill="#26323a">3. Multiple inheritance vtables</text>
  <text x="824" y="130" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">same RTTI, different offsets</text>
  <text x="844" y="148" text-anchor="start" font-family="Georgia, serif" font-size="13" font-weight="700" font-style="normal" fill="#26323a">Two vtable views for the same object</text>
  <rect x="844" y="170" width="62" height="27" rx="8" fill="#fff0d7" stroke="#c08a28" stroke-width="2"/>
  <text x="875.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">vptrL</text>
  <rect x="924" y="170" width="78" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="963.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">offset=0</text>
  <rect x="1020" y="170" width="84" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="1062.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">typeinfo*</text>
  <rect x="844" y="208" width="76" height="27" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="882.0" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">31 / 32</text>
  <line x1="906" y1="184" x2="924" y2="184" stroke="#c08a28" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="1002" y1="184" x2="1020" y2="184" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <rect x="844" y="276" width="62" height="27" rx="8" fill="#dff0ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="875.0" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">vptrR</text>
  <rect x="924" y="276" width="82" height="27" rx="8" fill="#f8e2e2" stroke="#c14d4d" stroke-width="2"/>
  <text x="965.0" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">offset=-8</text>
  <rect x="1024" y="276" width="84" height="27" rx="8" fill="#eef6ff" stroke="#4c87c6" stroke-width="2"/>
  <text x="1066.0" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">typeinfo*</text>
  <rect x="844" y="314" width="76" height="27" rx="8" fill="#f3faf3" stroke="#4f9b5d" stroke-width="2"/>
  <text x="882.0" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" font-style="normal" fill="#26323a">41 / 42</text>
  <line x1="906" y1="290" x2="924" y2="290" stroke="#4c87c6" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <line x1="1006" y1="290" x2="1024" y2="290" stroke="#c14d4d" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/>
  <text x="844" y="364" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">This second experiment group is pure ABI probing.</text>
  <text x="844" y="384" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">It answers what the vtable view looks like for single and multiple inheritance.</text>
  <text x="844" y="404" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">These boxes are vtable entries, not object fields.</text>
  <text x="50" y="490" text-anchor="start" font-family="Georgia, serif" font-size="12" font-weight="400" font-style="normal" fill="#5b6770">This figure is only about vtable layout probes. It does not try to explain object-size or lifecycle effects.</text>
</svg>
